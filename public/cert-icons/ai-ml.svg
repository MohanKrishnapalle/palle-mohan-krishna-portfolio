<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="24" fill="#0b151c"/>

  <!-- Neural network connections -->
  <path
    d="M30 38 L60 25
       M60 25 L90 38
       M30 38 L60 60
       M90 38 L60 60
       M30 82 L60 60
       M90 82 L60 60
       M60 60 L60 95"
    fill="none"
    stroke="#00eaff"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Neural network nodes -->
  <circle cx="30" cy="38" r="9" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>
  <circle cx="60" cy="25" r="9" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>
  <circle cx="90" cy="38" r="9" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>

  <circle cx="60" cy="60" r="11" fill="#0b151c" stroke="#ffffff" stroke-width="4"/>

  <circle cx="30" cy="82" r="9" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>
  <circle cx="90" cy="82" r="9" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>
  <circle cx="60" cy="95" r="8" fill="#0b151c" stroke="#00eaff" stroke-width="4"/>

  <!-- AI center mark -->
  <text
    x="60"
    y="66"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="10"
    font-weight="700"
    fill="#ffffff"
